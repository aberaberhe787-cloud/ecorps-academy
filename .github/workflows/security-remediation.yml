name: Security Remediation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Dependencies
        run: npm install && cd functions && npm install
      - name: Build
        run: npm run build && cd functions && npm run build
      - name: Type Check
        run: npm run lint && cd functions && npm run lint
